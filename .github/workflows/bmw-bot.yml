name: BMW Club Auto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run BMW bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@bmw_club_nalchik"
        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import subprocess
          import requests
          from pathlib import Path

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHANNEL = os.environ["CHANNEL"]

          STATE_FILE = Path("state.json")

          HASHTAGS = [
              "BMW",
              "BMWM",
              "BMWM3",
              "BMWM4",
              "BMWM5",
              "Bimmer",
              "BMWMotorsport",
              "BMWTuning"
          ]

          SEARCHES = [
              "BMW",
              "BMW M",
              "BMW M3",
              "BMW M4",
              "BMW M5",
              "BMW Motorsport",
              "BMW tuning"
          ]

          def load_state():
              if not STATE_FILE.exists():
                  return {"published": []}
              try:
                  return json.loads(STATE_FILE.read_text())
              except:
                  return {"published": []}

          def save_state(state):
              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2)
              )

          def telegram(method, data=None, files=None):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/{method}"
              r = requests.post(
                  url,
                  data=data,
                  files=files,
                  timeout=120
              )
              return r.json()

          def download_video(url, filename):
              cmd = [
                  "yt-dlp",
                  "--no-playlist",
                  "--max-filesize", "45M",
                  "-f", "mp4/best[ext=mp4]/best",
                  "-o", filename,
                  url
              ]

              result = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True,
                  timeout=180
              )

              return result.returncode == 0 and Path(filename).exists()

          def search_youtube(query):
              cmd = [
                  "yt-dlp",
                  f"ytsearch5:{query}",
                  "--flat-playlist",
                  "--print", "%(id)s|%(title)s|%(webpage_url)s",
                  "--skip-download"
              ]

              result = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True,
                  timeout=120
              )

              videos = []

              for line in result.stdout.splitlines():
                  parts = line.split("|", 2)

                  if len(parts) != 3:
                      continue

                  video_id, title, url = parts

                  videos.append({
                      "id": video_id,
                      "title": title,
                      "url": url,
                      "source": "YouTube"
                  })

              return videos

          def looks_like_bmw(title):
              text = title.lower()

              words = [
                  "bmw",
                  "bimmer",
                  "m3",
                  "m4",
                  "m5",
                  "m2",
                  "m8",
                  "x3m",
                  "x5m",
                  "x6m",
                  "motorsport"
              ]

              return any(word in text for word in words)

          def publish(video):
              url = video["url"]
              title = video["title"]

              filename = "bmw_video.mp4"

              print("Downloading:", url)

              if not download_video(url, filename):
                  print("Download failed")
                  return False

              caption = (
                  "🔥 BMW CLUB NALCHIK\n\n"
                  f"{title}\n\n"
                  "#BMW #Bimmer #BMWClubNalchik"
              )

              with open(filename, "rb") as video_file:
                  result = telegram(
                      "sendVideo",
                      data={
                          "chat_id": CHANNEL,
                          "caption": caption
                      },
                      files={
                          "video": video_file
                      }
                  )

              try:
                  os.remove(filename)
              except:
                  pass

              print(result)

              return result.get("ok", False)

          state = load_state()
          published = set(state.get("published", []))

          candidates = []

          for query in SEARCHES:
              try:
                  candidates.extend(search_youtube(query))
              except Exception as e:
                  print("Search error:", e)

          unique = []

          for video in candidates:
              if video["id"] in published:
                  continue

              if not looks_like_bmw(video["title"]):
                  continue

              if video["id"] in [x["id"] for x in unique]:
                  continue

              unique.append(video)

          print("BMW candidates:", len(unique))

          if unique:
              video = unique[0]

              if publish(video):
                  published.add(video["id"])

                  state["published"] = list(published)[-500:]

                  save_state(state)

                  print("Published:", video["title"])
              else:
                  print("Publication failed")
          else:
              print("No new BMW videos found")
          PY

          python bot.py

      - name: Save state
        run: |
          git config user.name "BMW Club Bot"
          git config user.email "bmw-club-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update BMW bot state"
          git push